<section id="bewerbung-form" class="cc-form-section">
  <div class="cc-form-wrap">
    <div class="cc-form-intro">
      <p class="cc-form-kicker">Jetzt bewerben</p>
      <h2 class="cc-form-title">Bereit für den nächsten Schritt?</h2>
      <p class="cc-form-sub">In 2 Minuten ausfüllen — danach wählen Sie direkt Ihren Wunschtermin für Ihr Online-Interview.</p>
      <p class="cc-form-meta">{{contact_phone}} &nbsp;·&nbsp; {{contact_email}}</p>
    </div>
    <form id="application-form" class="cc-form">
      <h3 class="cc-form-h3">Bewerbungsformular</h3>
      <div class="cc-form-row">
        <label>Vorname<input name="first_name" required placeholder="Max" /></label>
        <label>Nachname<input name="last_name" required placeholder="Mustermann" /></label>
      </div>
      <label>Straße &amp; Hausnummer<input name="street" placeholder="Musterstraße 12" /></label>
      <div class="cc-form-row">
        <label>PLZ<input name="postal_code" placeholder="10115" /></label>
        <label>Stadt<input name="city" placeholder="Berlin" /></label>
      </div>
      <label>Telefonnummer<input name="phone" required placeholder="+49 …" /></label>
      <label>E-Mail-Adresse<input type="email" name="email" required placeholder="name@beispiel.de" /></label>
      <button type="submit" class="cc-form-submit">Bewerbung absenden</button>
      <p id="form-status" class="cc-form-status"></p>
    </form>
  </div>
</section>
